langcode: en
status: true
dependencies: {  }
id: ldap_roles
label: 'LDAP Roles'
provider: ldap_provider
provider_config:
  status:
    server: hogwarts
    only_ldap_authenticated: true
  filter_and_mappings:
    use_first_attr_as_groupid: false
provider_mappings:
  -
    query: 'cn=users,ou=groups,dc=hogwarts,dc=edu'
    is_regex: false
  -
    query: 'cn=gryffindor,ou=groups,dc=hogwarts,dc=edu'
    is_regex: false
consumer: authorization_drupal_roles
consumer_config: {  }
consumer_mappings:
  -
    role: student
  -
    role: wizard
synchronization_modes:
  user_logon: user_logon
synchronization_actions:
  revoke_provider_provisioned: revoke_provider_provisioned
  regrant_provider_provisioned: regrant_provider_provisioned
  create_consumers: 0
