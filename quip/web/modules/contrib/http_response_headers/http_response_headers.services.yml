services:
  http_response_headers:
    class: '\Drupal\http_response_headers\EventSubscriber\AddHTTPHeaders'
    arguments: ['@entity_type.manager', '@context.handler', '@context.repository']
    tags:
      - { name: 'event_subscriber' }

  Drupal\http_response_headers\Hook\HttpResponseHeadersHooks:
    class: Drupal\http_response_headers\Hook\HttpResponseHeadersHooks
    autowire: true
